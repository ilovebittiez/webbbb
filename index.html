<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle AGOTADO BTS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #0077cc;
        }
        #agotado {
            font-size: 2em;
            color: red;
            margin: 20px 0;
        }
        button {
            padding: 15px 30px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>
    <h1>Mi Página Local</h1>

    <div id="agotado">AGOTADO BTS</div>

    <button onclick="toggleAgotado()">Mostrar/Ocultar AGOTADO BTS</button>

    <script>
        // Al cargar la página, revisamos si estaba oculto antes (opcional)
        if (localStorage.getItem('agotadoQuitado') === 'true') {
            document.getElementById('agotado').style.display = 'none';
        }

        function toggleAgotado() {
            var elem = document.getElementById('agotado');
            if (elem.style.display === 'none') {
                elem.style.display = 'block';
                localStorage.setItem('agotadoQuitado', 'false');
            } else {
                elem.style.display = 'none';
                localStorage.setItem('agotadoQuitado', 'true');
            }
        }
    </script>
</body>
</html>
